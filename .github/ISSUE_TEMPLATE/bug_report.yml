name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove tokens, site URLs and content you are not allowed to share before posting.
  - type: input
    id: package
    attributes:
      label: Package
      description: e.g. approval, people, atlassian
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: approvekit version
    validations:
      required: true
